{% load static i18n %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE|default:'ar' }}" dir="{% if LANGUAGE_CODE|slice:':2' == 'en' %}ltr{% else %}rtl{% endif %}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ورشة — Warsha{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            garage: { 950: '#0c0a09', 900: '#14100e', 800: '#1a1612' },
            copper: { DEFAULT: '#c87941', bright: '#e8a066', dim: '#8a4f28' },
            paper: { DEFAULT: '#f5efe6', muted: '#a89f94' },
          },
          fontFamily: {
            ar: ['Tajawal', 'system-ui', 'sans-serif'],
            en: ['DM Sans', 'system-ui', 'sans-serif'],
          },
          boxShadow: {
            glow: '0 8px 32px rgba(232, 160, 102, 0.35)',
            'glow-lg': '0 12px 40px rgba(232, 160, 102, 0.45)',
          },
          animation: {
            'fade-up': 'fadeUp 0.55s ease both',
            'pulse-slow': 'pulseSlow 4s ease-in-out infinite',
          },
        },
      },
      safelist: [
        'status-pending_review', 'status-quoted', 'status-paid', 'status-in_progress',
        'status-ready_for_pickup', 'status-completed', 'status-cancelled',
      ],
    };
  </script>
  <link rel="stylesheet" href="{% static 'css/warsha.css' %}">
</head>
<body class="min-h-dvh {% if LANGUAGE_CODE|slice:':2' == 'en' %}font-en{% else %}font-ar{% endif %} text-paper bg-garage-950 bg-[radial-gradient(ellipse_80%_60%_at_50%_-10%,rgba(200,121,65,0.22),transparent),radial-gradient(ellipse_50%_40%_at_100%_50%,rgba(232,160,102,0.08),transparent),linear-gradient(180deg,#0c0a09_0%,#14100e_100%)] bg-fixed {% block body_class %}{% endblock %}">
  {% block site_header %}
  <header class="sticky top-0 z-50 flex items-center justify-between gap-3 border-b border-copper/20 bg-garage-950/80 px-4 py-3 backdrop-blur-xl sm:px-5">
    <a href="{% url 'home' %}" class="inline-flex items-center gap-2 text-lg font-extrabold text-paper no-underline">
      <i class="fa-solid fa-screwdriver-wrench text-xl text-copper-bright drop-shadow-[0_0_8px_rgba(232,160,102,0.5)]" aria-hidden="true"></i>
      <span class="inline-flex items-baseline gap-2" dir="ltr">
        <span lang="ar">ورشة</span>
        <span class="font-en text-sm font-medium tracking-wide text-copper-bright" lang="en">Warsha</span>
      </span>
    </a>
    {% include "shared/partials/locale_toggle.html" %}
  </header>
  {% endblock %}
  <main class="{% block page_class %}mx-auto max-w-lg px-4 py-4 pb-8{% endblock %}">
    {% block content %}{% endblock %}
  </main>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</body>
</html>
