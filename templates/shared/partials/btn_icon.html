{% if tag == 'a' %}
<a
  href="{{ href }}"
  class="btn-icon {{ extra_class }}"
  aria-label="{{ aria_label }}"
  {% if id %}id="{{ id }}"{% endif %}
>
  <i class="{{ icon }}" aria-hidden="true"></i>
</a>
{% else %}
<button
  type="{{ type|default:'button' }}"
  class="btn-icon {{ extra_class }}"
  aria-label="{{ aria_label }}"
  {% if id %}id="{{ id }}"{% endif %}
  {% if name %}name="{{ name }}"{% endif %}
  {% if disabled %}disabled{% endif %}
>
  <i class="{{ icon }}" aria-hidden="true"></i>
</button>
{% endif %}
