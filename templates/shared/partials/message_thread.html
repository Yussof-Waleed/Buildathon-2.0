{% for message in thread_messages %}
  <div class="max-w-[88%] rounded-2xl px-4 py-2.5 text-sm
    {% if message.author_type == 'customer' %}self-start rounded-br-sm border border-emerald-500/25 bg-emerald-500/10
    {% elif message.author_type == 'mechanic' %}self-end rounded-bl-sm border border-white/10 bg-garage-800
    {% else %}self-center rounded-xl border border-dashed border-copper/30 bg-copper/10 text-center text-paper-muted{% endif %}">
    <span class="font-en text-[0.65rem] uppercase tracking-wider text-paper-muted" lang="en" dir="ltr">{{ message.get_author_type_display }}</span>
    {% if message.body %}
      <p class="m-0 whitespace-pre-wrap" dir="auto">{{ message.body }}</p>
    {% endif %}
    {% if message.audio %}
      <audio controls class="audio-compact" preload="metadata">
        <source src="{{ message.audio.url }}">
      </audio>
    {% endif %}
  </div>
{% empty %}
  <p class="text-sm text-paper-muted">لا رسائل بعد.</p>
{% endfor %}
