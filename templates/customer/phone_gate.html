{% extends "shared/base.html" %}

{% block title %}ورشة — أدخل رقمك{% endblock %}

{% block content %}
<section class="page-card animate-fade-up mx-auto mt-10 max-w-md">
  <h1 class="text-xl font-extrabold text-paper">أهلاً في ورشة</h1>
  <p class="mt-1 text-xs text-paper-muted">رقمك يكفي — بدون OTP</p>

  {% if error %}
    <p class="mt-3 rounded-lg border border-red-500/30 bg-red-500/10 px-3 py-2 text-xs text-red-200">{{ error }}</p>
  {% endif %}

  <form method="post" class="mt-5 flex flex-col gap-2.5">
    {% csrf_token %}
    <label for="phone" class="text-xs font-semibold text-paper-muted">رقم الموبايل</label>
    <div class="flex overflow-hidden rounded-xl border border-white/10 bg-black/30 focus-within:border-copper-bright focus-within:ring-2 focus-within:ring-copper-bright/20">
      <span class="flex items-center border-s border-white/10 bg-copper/15 px-3 font-en text-sm font-semibold text-copper-bright" aria-hidden="true">+20</span>
      <input
        type="tel"
        id="phone"
        name="phone"
        dir="ltr"
        placeholder="1012345678"
        autocomplete="tel"
        required
        class="flex-1 border-0 bg-transparent px-3 py-2.5 text-sm text-paper placeholder:text-paper-muted/50 focus:ring-0"
      >
    </div>
    <button type="submit" class="btn-pill btn-pill-primary mt-1 w-full justify-center">
      <span>ادخل الورشة</span>
    </button>
  </form>
</section>
{% endblock %}
