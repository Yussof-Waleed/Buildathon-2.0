<c-vars icon="" step="" title="" class="" />
<article class="landing-step {{ class }}" {{ attrs }}>
  <div class="flex items-start gap-3">
    <span class="landing-step-num" aria-hidden="true">{{ step }}</span>
    <div class="min-w-0 flex-1">
      <span class="landing-step-icon" aria-hidden="true"><i class="{{ icon }}"></i></span>
      <h3 class="landing-step-title mt-2 font-heading text-lg font-bold text-paper">{{ title }}</h3>
      <p class="mt-1.5 text-base leading-relaxed text-paper-muted">{{ slot }}</p>
    </div>
  </div>
</article>
